<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Support RAG System</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .app-container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 90vh;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .header p {
        opacity: 0.9;
        font-size: 1rem;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 15px;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.2);
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 0.9rem;
      }

      .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .sidebar {
        width: 300px;
        background: #f8f9fa;
        border-right: 1px solid #e0e0e0;
        padding: 20px;
        overflow-y: auto;
      }

      .sidebar h3 {
        margin-bottom: 15px;
        color: #333;
      }

      .example-question {
        background: white;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        border: 1px solid #e0e0e0;
        font-size: 0.9rem;
      }

      .example-question:hover {
        background: #667eea;
        color: white;
        transform: translateX(5px);
      }

      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #f8f9fa;
      }

      .messages-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }

      .welcome-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 40px;
      }

      .welcome-icon {
        font-size: 4rem;
        margin-bottom: 20px;
      }

      .welcome-screen h2 {
        color: #333;
        margin-bottom: 10px;
      }

      .welcome-screen p {
        color: #666;
        max-width: 500px;
      }

      .message {
        margin-bottom: 20px;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        display: flex;
        justify-content: flex-end;
      }

      .message.assistant {
        display: flex;
        justify-content: flex-start;
      }

      .message-content {
        max-width: 70%;
        padding: 15px 20px;
        border-radius: 15px;
        position: relative;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .message.assistant .message-content {
        background: white;
        color: #333;
        border: 1px solid #e0e0e0;
      }

      .message-text {
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .sources {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }

      .sources-title {
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
        opacity: 0.8;
      }

      .source-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .source-tag {
        background: rgba(102, 126, 234, 0.1);
        color: #667eea;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.8rem;
      }

      .loading {
        display: flex;
        gap: 8px;
        padding: 15px;
      }

      .loading-dot {
        width: 8px;
        height: 8px;
        background: #667eea;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .loading-dot:nth-child(2) {
        animation-delay: -0.32s;
      }

      .loading-dot:nth-child(3) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      .input-area {
        padding: 20px;
        background: white;
        border-top: 1px solid #e0e0e0;
      }

      .input-container {
        display: flex;
        gap: 10px;
        max-width: 900px;
        margin: 0 auto;
      }

      .input-field {
        flex: 1;
        padding: 15px 20px;
        border: 2px solid #e0e0e0;
        border-radius: 25px;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s;
      }

      .input-field:focus {
        border-color: #667eea;
      }

      .send-button {
        padding: 15px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .send-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .error-message {
        background: #fee;
        color: #c33;
        padding: 15px;
        border-radius: 10px;
        margin: 10px 20px;
        border: 1px solid #fcc;
      }

      @media (max-width: 768px) {
        .main-content {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          height: auto;
          max-height: 200px;
        }

        .message-content {
          max-width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const API_URL = "http://localhost:5000";

      function App() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [stats, setStats] = useState({ chunks: 0, status: "loading" });
        const messagesEndRef = useRef(null);

        const exampleQuestions = [
          "What is the refund policy?",
          "How do I upgrade my subscription?",
          "What storage plans are available?",
          "How to troubleshoot server crashes?",
          "How do I enable 2FA?",
          "What are the payment methods?",
          "How do I reset my password?",
          "What is the billing cycle?",
        ];

        useEffect(() => {
          fetchStats();
        }, []);

        useEffect(() => {
          scrollToBottom();
        }, [messages]);

        const scrollToBottom = () => {
          messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
        };

        const fetchStats = async () => {
          try {
            const response = await fetch(`${API_URL}/health`);
            const data = await response.json();
            setStats(data);
          } catch (err) {
            console.error("Failed to fetch stats:", err);
          }
        };

        const handleSubmit = async (questionText = null) => {
          const question = questionText || input;
          if (!question.trim() || loading) return;

          setInput("");
          setError("");

          // Add user message
          const userMessage = {
            role: "user",
            content: question,
          };
          setMessages((prev) => [...prev, userMessage]);
          setLoading(true);

          try {
            const response = await fetch(`${API_URL}/query`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ question, top_k: 3 }),
            });

            if (!response.ok) {
              throw new Error("Failed to get response");
            }

            const data = await response.json();

            // Add assistant message
            const assistantMessage = {
              role: "assistant",
              content: data.answer,
              sources: data.sources || [],
            };
            setMessages((prev) => [...prev, assistantMessage]);
          } catch (err) {
            setError(
              "Failed to get response. Make sure the Flask server is running on port 5000."
            );
            console.error(err);
          } finally {
            setLoading(false);
          }
        };

        const handleKeyPress = (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSubmit();
          }
        };

        return (
          <div className="app-container">
            <div className="header">
              <h1>🤖 Customer Support RAG System</h1>
              <p>AI-Powered Knowledge Base Assistant</p>
              <div className="stats">
                <div className="stat-item">
                  📚 {stats.chunks || 0} Document Chunks
                </div>
                <div className="stat-item">
                  ✅ {stats.status === "healthy" ? "Online" : "Loading..."}
                </div>
              </div>
            </div>

            <div className="main-content">
              <div className="sidebar">
                <h3>💡 Example Questions</h3>
                {exampleQuestions.map((question, index) => (
                  <div
                    key={index}
                    className="example-question"
                    onClick={() => handleSubmit(question)}
                  >
                    {question}
                  </div>
                ))}
              </div>

              <div className="chat-area">
                <div className="messages-container">
                  {messages.length === 0 ? (
                    <div className="welcome-screen">
                      <div className="welcome-icon">🚀</div>
                      <h2>Welcome to Your RAG System!</h2>
                      <p>
                        Ask any question about billing, accounts, storage, or
                        technical issues. Click an example question on the left
                        or type your own below.
                      </p>
                    </div>
                  ) : (
                    <>
                      {messages.map((message, index) => (
                        <div key={index} className={`message ${message.role}`}>
                          <div className="message-content">
                            <div className="message-text">
                              {message.content}
                            </div>
                            {message.sources && message.sources.length > 0 && (
                              <div className="sources">
                                <div className="sources-title">📄 Sources:</div>
                                <div className="source-tags">
                                  {message.sources.map((source, idx) => (
                                    <div key={idx} className="source-tag">
                                      {source.category}/{source.filename}
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                      {loading && (
                        <div className="message assistant">
                          <div className="message-content">
                            <div className="loading">
                              <div className="loading-dot"></div>
                              <div className="loading-dot"></div>
                              <div className="loading-dot"></div>
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={messagesEndRef} />
                    </>
                  )}
                </div>

                {error && <div className="error-message">⚠️ {error}</div>}

                <div className="input-area">
                  <div className="input-container">
                    <input
                      type="text"
                      className="input-field"
                      placeholder="Ask a question about policies, products, or technical issues..."
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyPress={handleKeyPress}
                      disabled={loading}
                    />
                    <button
                      className="send-button"
                      onClick={() => handleSubmit()}
                      disabled={loading || !input.trim()}
                    >
                      {loading ? "Thinking..." : "Send"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
